<!--
  桌面 app 圖示的原始檔，`tauri icon` 從它生成 icons/ 下的全部尺寸與格式。
  改了圖示就重跑：npx tauri icon src-tauri/icons/source.svg

  與 media/icon.svg 是同一個書本符號，但**不能直接拿那個檔案當 app 圖示**：
  那是給 VS Code 活動欄用的單色線稿（stroke="currentColor"，靠繼承色），
  單獨渲染出來既沒有顏色、又只有幾根細線，在工作列和桌面上幾乎看不見。
  所以這裡補上品牌藍的圓角底板，線稿改成白色。
  （src/standalone/server.ts 處理 favicon 時踩過同一個坑，那邊的解法是把
  currentColor 換成品牌藍。）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" rx="228" fill="#0078d4"/>
  <g transform="translate(220 232) scale(23.33)"
     fill="none" stroke="#ffffff" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H19v18H6.5A2.5 2.5 0 0 0 4 22z"/>
    <path d="M8 6.5h7M8 10h7M8 13.5h4"/>
  </g>
</svg>
