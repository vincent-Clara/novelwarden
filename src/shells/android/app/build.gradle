plugins {
    id 'com.android.application'
}

// 版本號只記在倉庫根 package.json（tests/contract/version.test.js 守著）：0.2.8 → versionCode 208
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../../package.json')).version
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.')[0..2]*.toInteger()

// 發版簽名：CI 從 secrets 還原 keystore 後經環境變數傳進來。沒有就退回 debug 簽名（本地自用）——
// 兩種簽名的包不能互相覆蓋安裝，發出去的包必須一直用同一把發版金鑰
def releaseKeystore = System.getenv('NOVELFORGE_KEYSTORE')

android {
    namespace 'io.github.noir017.novelforge'
    // arm64 Linux 上只能用 Debian 的 aapt2（Android 14），讀不了 android-35 的 android.jar，所以停在 34
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.noir017.novelforge'
        minSdk 26
        targetSdk 34
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
        // 內建服務端的 node 取自 Termux，只有 arm64
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('NOVELFORGE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NOVELFORGE_KEY_ALIAS') ?: 'novelforge'
                keyPassword System.getenv('NOVELFORGE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // node 和依賴庫要真正解壓到 nativeLibraryDir 才能執行
    packaging {
        jniLibs { useLegacyPackaging true }
    }
}
