# 正式釋出：推一個 v* tag 觸發，一次出齊四條釋出路徑的產物。
#
# 與 app.yml 的分工：app.yml 是手動點的桌面殼構建（日常驗證「還能編出來」），
# 這個檔案是**發版**時才跑的一條完整流水線——桌面安裝包 + VS Code 擴充套件
# .vsix + 獨立版單檔案可執行 + Android 安裝包（調 android.yml），彙總成一個 GitHub Release 草稿；
# 另外調 docker.yml 往 GHCR 推獨立版的 Docker 映象。
#
# 版本號只記在倉庫根 package.json 一處（tauri.conf.json 指過去，獨立版編譯時寫程序序）。
# 發版在本地做：`npm version patch|minor|major` 先跑全量測試，再改版本號、提交、打 tag，
# `git push --follow-tags` 推上來就到這裡。所以這條流水線**不改版本號、不往 main 寫**，
# 只核對 tag 與 package.json 對得上。
#
# 只認 tag 觸發：這條流水線要編兩次 Rust 殼、跑兩遍全量測試，是倉庫裡最貴的一個 job，
# 不該由推 main 引發；而 tag 本身就是「決定發版」這件事。
name: release

on:
  push:
    tags: ['v*']

# 同一個 tag 重複觸發時，掐掉舊的那次——兩次釋出跑在一起只會互相踩。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 建立 Release 要寫許可權

jobs:
  # ── 1) 版本號核對 ───────────────────────────────────────────────
  # tag 是誰打的不由這裡管（本地 npm version 打），但 tag 與 package.json 對不上的話，
  # Release 的名字與安裝包裡的版本號就是兩個數，所以先核對，對不上就整條停下。
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 核對版本號
        id: pick
        run: |
          tag="${{ github.ref_name }}"
          v="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$v" != "$pkg" ]; then
            echo "::error::tag $tag 與 package.json 的版本號 $pkg 對不上（應當用 npm version 打 tag）"
            exit 1
          fi
          # Windows MSI 只認純數字的版本號，0.2.0-beta.0 這種在桌面構建那一步才會炸，這裡先攔下。
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本號 $v 不是 X.Y.Z（只支援 npm version patch / minor / major）"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "本次釋出版本：$v"

  # ── 2) VS Code 擴充套件 + 獨立版可執行 ──────────────────────────────
  # 這兩樣合成一個 job：都只依賴 Node/Bun，不需要 Rust，也不需要原生 Windows
  # ——Bun 能交叉編譯出 .exe。合在一起省一次 npm ci 和一遍測試。
  bundles:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      # 閘門：測試掛了就不該有產物流出去。
      - name: 跑測試
        run: npm test

      # 獨立版：兩個平臺都由 Bun 交叉編譯，產物帶平臺字尾便於區分。
      - name: 構建獨立版（linux + windows）
        run: |
          node scripts/embed-media.js
          bun build src/shells/standalone/main.ts --compile \
            --target=bun-linux-x64 --outfile dist/novelwarden-linux-x64
          bun build src/shells/standalone/main.ts --compile \
            --target=bun-windows-x64 --outfile dist/novelwarden-windows-x64.exe

      # .vsix 必須在獨立版**之後**打，且靠 .vscodeignore 把 dist/novelwarden*
      # 排除掉——否則 113 MB 的可執行會被塞進擴充套件包。
      - name: 打包 .vsix
        run: npx --yes @vscode/vsce@latest package --no-dependencies --out novelwarden-${{ needs.version.outputs.version }}.vsix

      # 防呆閘門：.claude/ 與 local/ 是本機私有目錄，絕不能進公開產物。
      # vsce 一旦看到 .vscodeignore 就完全無視 .gitignore，所以這裡實測一遍
      # 包內清單，而不是信任配置。
      - name: 校驗 .vsix 未夾帶私有檔案
        run: |
          list="$(unzip -Z1 novelwarden-${{ needs.version.outputs.version }}.vsix)"
          echo "$list"
          if echo "$list" | grep -Ei '(^|/)(\.claude|\.cursor|\.worktrees|local|temp)/'; then
            echo "::error::.vsix 裡夾帶了私有目錄，檢查 .vscodeignore"
            exit 1
          fi
          if echo "$list" | grep -E 'dist/novelwarden'; then
            echo "::error::.vsix 裡夾帶了獨立版可執行（應由 .vscodeignore 排除）"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            *.vsix
            dist/novelwarden-linux-x64
            dist/novelwarden-windows-x64.exe
          if-no-files-found: error

  # ── 3) 桌面安裝包 ───────────────────────────────────────────────
  # Rust 殼不能交叉編譯，所以每個平臺一臺原生 runner。
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 而不是 latest：連結的 glibc 越低，能裝的發行版越多。
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 跑測試
        run: npm test

      - name: Linux 構建依賴
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      # 編 Rust 殼很慢，快取能把重複構建從幾分鐘壓到幾十秒。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/shells/desktop

      # sidecar 由 tauri.conf.json 的 beforeBuildCommand 自動構建，不必單獨跑。
      #
      # Linux 只出 deb + rpm，**不出 AppImage**：AppImage 由 linuxdeploy 打，
      # 而 linuxdeploy 會對包進去的每個可執行跑 patchelf 改 ELF 頭。我們的
      # sidecar 是 Bun `--compile` 出來的單檔案可執行——ELF 後面直接粘著 JS
      # 執行時與指令碼，patchelf 一改就把這段 payload 的偏移弄壞。裝了 libfuse2、
      # 加了 APPIMAGE_EXTRACT_AND_RUN 與 NO_STRIP 都只解決「linuxdeploy 跑不
      # 起來」，解決不了「它不該碰這個二進位制」。deb / rpm 走 Tauri 自己的打包
      # 器，原樣複製 sidecar，所以一直是好的。
      #
      # 要恢復 AppImage 就得讓 sidecar 不經 linuxdeploy 之手（例如改由 app
      # 執行時下載，或換成非單檔案的分發形式），那是另一件事。
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src/shells/desktop
          args: ${{ matrix.name == 'linux' && '--bundles deb,rpm' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # sidecar 是 Bun 編出來的單檔案可執行，strip 會把內嵌的 JS 執行時
          # 弄壞。deb/rpm 這條路本來不 strip，留著它是防打包器換實現。
          NO_STRIP: true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          # 只收安裝包，不收 90 MB 的 sidecar 中間產物。各平臺產出什麼由
          # Tauri 按平臺決定，所以用通配而不寫死目錄名。
          path: |
            src/shells/desktop/target/release/bundle/*/*.deb
            src/shells/desktop/target/release/bundle/*/*.rpm
            src/shells/desktop/target/release/bundle/*/*.exe
            src/shells/desktop/target/release/bundle/*/*.msi
          if-no-files-found: error

  # ── 4) Docker 映象 ──────────────────────────────────────────────
  # 整條流程在 docker.yml 裡（手動點也走它，自帶測試閘門與冒煙），這裡只給版本號。
  # 和別的 job 並行，不攔 Release 草稿。注意映象推上 GHCR 就公開了（:latest 也跟著動），
  # 不等作者在 GitHub 上把草稿點成公開。
  docker:
    needs: version
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.version.outputs.version }}
    # 被呼叫的 workflow 只能在這裡給的許可權內再收緊，所以推 GHCR 的寫許可權得從這裡給。
    permissions:
      contents: read
      packages: write

  # ── 5) Android 安裝包 ───────────────────────────────────────────
  # 整條流程在 android.yml 裡（手動點出 debug 包也走它）。發版金鑰在倉庫 secrets 裡，缺了這一步就失敗，
  # 整個 Release 停下——不能退回 debug 簽名，簽名不同的包裝過的人升不了級。
  android:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets:
      NOVELFORGE_KEYSTORE_BASE64: ${{ secrets.NOVELFORGE_KEYSTORE_BASE64 }}
      NOVELFORGE_KEYSTORE_PASSWORD: ${{ secrets.NOVELFORGE_KEYSTORE_PASSWORD }}

  # ── 6) 彙總成 Release ───────────────────────────────────────────
  release:
    needs: [version, bundles, desktop, android]
    runs-on: ubuntu-latest
    steps:
      # 按名字只取 bundles 與 desktop-*，不能不帶名字全拉：docker job 裡的
      # build-push-action 會順手傳兩個「<倉庫>~XXXX.dockerbuild」構建記錄，
      # download-artifact 解不開，整步失敗（v0.2.0～v0.2.2 的 Release 都死在這）。
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: artifacts/bundles
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: artifacts/android

      # 三個 job 的產物散在各自子目錄裡，攤平到一層、統一改名再上傳。
      #
      # 各家打包器的名字各是各的（Tauri 用產品名「Novelwarden」：
      # `Novelwarden_0.3.0_x64-setup.exe`；vsce 是 `novelwarden-0.3.0.vsix`；獨立版不帶版本號），
      # Windows 下桌面安裝器和獨立版又都是 .exe，下載頁上分不出誰是誰。一律改成
      # `Novelwarden-<版本>-<形態>-<系統>-<架構>`：形態是 desktop（桌面版，裝了雙擊開啟）、
      # server（獨立版，跑起來用瀏覽器開啟）、vscode（外掛）、android（手機 app，內建的 node 只有 arm64）；
      # 桌面與獨立版的架構一律寫 x64（deb 叫 amd64、rpm 叫 x86_64）。
      # 只在這裡改：前面各 job 的中間產物名照舊（.vscodeignore 按 dist/novelwarden* 排除獨立版）。
      # 每個原始檔必須正好一個，產物多了、少了都停下，不靜默漏傳。
      - name: 攤平產物並統一改名
        run: |
          p="Novelwarden-${{ needs.version.outputs.version }}"
          mkdir -p out
          put() {
            local hits n
            hits="$(find artifacts -type f -name "$1")"
            n="$(printf '%s' "$hits" | grep -c . || true)"
            if [ "$n" -ne 1 ]; then
              echo "::error::產物 $1 應當正好 1 個，找到 $n 個"
              printf '%s\n' "$hits"
              exit 1
            fi
            cp "$hits" "out/$2"
          }
          put '*-setup.exe'                "$p-desktop-windows-x64-setup.exe"
          put '*.msi'                      "$p-desktop-windows-x64.msi"
          put '*.deb'                      "$p-desktop-linux-x64.deb"
          put '*.rpm'                      "$p-desktop-linux-x64.rpm"
          put 'novelwarden-windows-x64.exe' "$p-server-windows-x64.exe"
          put 'novelwarden-linux-x64'       "$p-server-linux-x64"
          put '*.vsix'                      "$p-vscode.vsix"
          put 'novelwarden-android.apk'     "$p-android-arm64.apk"
          total="$(find artifacts -type f | wc -l)"
          if [ "$total" -ne "$(ls out | wc -l)" ]; then
            echo "::error::產物裡有 $total 個檔案，只認領了 $(ls out | wc -l) 個——新的產物要在上面加一行改名"
            find artifacts -type f
            exit 1
          fi
          ls -lh out

      # 一律先出草稿：作者在 GitHub 上看過產物再點公開。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Novelwarden ${{ needs.version.outputs.tag }}
          draft: true
          files: out/*
          fail_on_unmatched_files: true
