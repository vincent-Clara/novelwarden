# Android app 的構建。兩種用法：
# - 手動點（workflow_dispatch）：日常驗證「還能編出來」、拿去手機上試，產物只進 artifact。
# - 發版時由 release.yml 呼叫（release: true）：產物交給 release 彙總。
#
# 兩種都用倉庫 secrets 裡的發版金鑰簽名：CI 上的 debug 簽名每次構建都是新生成的一把，兩次的包不能互相覆蓋安裝，
# 每試一次都得先解除安裝，app 私有目錄裡的配置與 API Key 跟著沒了。手動點時沒有金鑰才退回 debug 簽名（並警告）；發版時沒有就停下。
#
# 為什麼在 CI 上編：Google 的 aapt2 只出 x86_64，開發機是 arm64；ubuntu runner 自帶 Android SDK。
# 打包本身見 src/shells/android/scripts/build.sh：獨立版打成 node 單檔案進 assets，Termux 的 node 進 jniLibs。
name: android

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      NOVELFORGE_KEYSTORE_BASE64:
        required: false
      NOVELFORGE_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # 閘門：殼不該掩蓋核心的問題。測試掛了就不要出包。
      - name: 跑測試
        run: npm test

      - name: 打包
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVELFORGE_KEYSTORE_BASE64 }}
          NOVELFORGE_KEYSTORE_PASSWORD: ${{ secrets.NOVELFORGE_KEYSTORE_PASSWORD }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$NOVELFORGE_KEYSTORE_PASSWORD" ]; then
            export NOVELFORGE_KEYSTORE="$RUNNER_TEMP/release.jks"
            base64 -d <<<"$KEYSTORE_BASE64" > "$NOVELFORGE_KEYSTORE"
            keytool -list -keystore "$NOVELFORGE_KEYSTORE" -storepass "$NOVELFORGE_KEYSTORE_PASSWORD" -alias novelforge | grep -i fingerprint
            src/shells/android/scripts/build.sh release
            rm -f "$NOVELFORGE_KEYSTORE"
            cp src/shells/android/app/build/outputs/apk/release/app-release.apk novelwarden-android.apk
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::倉庫 secrets 裡缺 NOVELFORGE_KEYSTORE_BASE64 / NOVELFORGE_KEYSTORE_PASSWORD（Android 發版金鑰）"
            exit 1
          else
            echo "::warning::沒有發版金鑰，出的是 debug 簽名的包：和發版的包簽名不同，不能互相覆蓋安裝"
            src/shells/android/scripts/build.sh debug
            cp src/shells/android/app/build/outputs/apk/debug/app-debug.apk novelwarden-android-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: novelwarden-android*.apk
          if-no-files-found: error
