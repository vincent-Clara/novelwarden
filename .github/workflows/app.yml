# 桌面 app 的雙平臺構建，手動點（日常驗證「還能編出來」，產物只進 artifact，不釋出）。
#
# 為什麼必須用 CI：sidecar 能靠 Bun 交叉編譯（在 Linux 上就能出 Windows 的 .exe），
# 但 **Tauri 的 Rust 殼不能**——Windows 安裝包得在 Windows 上編。所以每個平臺
# 一臺 runner，各自原生編譯自己的 sidecar 與安裝包。
#
# 不認 tag：推 v* tag 是發版，由 release.yml 出齊全部產物；這裡也認的話同一個 tag
# 要編兩遍。版本號用的是倉庫裡 package.json 當下的值，這裡不改它。
name: app

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 而不是 latest：deb / rpm 連結的 glibc 版本越低，
          # 能裝的發行版越多。
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 閘門：殼不該掩蓋核心的問題。測試掛了就不要出包。
      - name: 跑測試
        run: npm test

      - name: Linux 構建依賴
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      # 編譯 Rust 殼很慢，快取能把重複構建從幾分鐘壓到幾十秒。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/shells/desktop

      # sidecar 由 tauri.conf.json 的 beforeBuildCommand 自動構建，
      # 不必在這裡單獨跑一步。

      # projectPath 指向桌面殼所在目錄（Tauri 工程根就是它自己，裡面直接放著
      # tauri.conf.json）。不給這個引數的話 action 會從倉庫根去找 src-tauri/。
      #
      # Linux 只出 deb + rpm：AppImage 由 linuxdeploy 打，而它會對包進去的每個
      # 可執行跑 patchelf 改 ELF 頭——sidecar 是 Bun --compile 出來的單檔案，
      # ELF 後面粘著 JS 執行時，一改就壞。詳見 release.yml 裡同一處的註釋。
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src/shells/desktop
          args: ${{ matrix.name == 'linux' && '--bundles deb,rpm' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: true

      - uses: actions/upload-artifact@v4
        with:
          name: novelwarden-${{ matrix.name }}
          # 只收安裝包，不收 90 MB 的 sidecar 中間產物。各平臺產出什麼由 Tauri
          # 按平臺決定，所以這裡用通配而不是寫死目錄名。
          path: |
            src/shells/desktop/target/release/bundle/*/*.deb
            src/shells/desktop/target/release/bundle/*/*.rpm
            src/shells/desktop/target/release/bundle/*/*.exe
            src/shells/desktop/target/release/bundle/*/*.msi
          if-no-files-found: error
