# 獨立版的 Docker 映象（linux/amd64 + linux/arm64），推到 GHCR：ghcr.io/noir017/novelwarden。
#
# 兩種跑法：
# - 手動點：推 :edge 與 :sha-<短雜湊>，日常驗證「還能編出來、起得來」；
# - 發版時由 release.yml 調過來（workflow_call，帶 version）：推 :X.Y.Z 與 :latest。
#
# 映象怎麼編見倉庫根的 Dockerfile：可執行檔案兩個架構都由 Bun 交叉編譯；執行段有一條 apt（裝 git），
# arm64 那一層經 QEMU 模擬（setup-qemu-action）。
# GHCR 用 GITHUB_TOKEN 登入，不另配 secret。包第一次推上去預設是私有的，要在包設定裡改一次 public，
# 否則拉映象前得先 docker login。
name: docker

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 釋出的版本號（X.Y.Z，不帶 v）
        type: string
        required: true

# 與 release.yml 的 concurrency 組名不能相同：被呼叫時兩邊同名會互相等，卡死。
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # 推 GHCR

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # 冒煙用的一次性令牌，只活在這臺 runner 上，不是機密。
      SMOKE_TOKEN: smoke-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      # 閘門：測試掛了就不要出映象。映象裡的構建不跑測試，所以在這裡跑。
      - name: 跑測試
        run: npm test

      - name: 定映象名與標籤
        id: meta
        run: |
          # 映象名固定為新倉庫名（GitHub 倉庫改名後 GITHUB_REPOSITORY 才會跟著變）。
          image="ghcr.io/noir017/novelwarden"
          version="${{ inputs.version }}"
          if [ -n "$version" ]; then
            tags="$image:$version,$image:latest"
          else
            version="$(node -p "require('./package.json').version")-edge"
            tags="$image:edge,$image:sha-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "本次推：$tags"

      # 執行段的 apt-get（裝 git）在 arm64 上要模擬執行。
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # 先只編 amd64、裝進本機 docker 做冒煙，過了再編雙架構推送——壞映象不該推上去。
      # 第二次編 amd64 全吃這次的快取。
      - name: 編 amd64（冒煙用）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: novelwarden:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒煙：起容器、走一遍登入
        run: |
          # 映象裡綁 0.0.0.0：不給令牌必須拒絕啟動（退出碼 1）。起來了會一直跑，所以套個 timeout。
          status=0
          timeout 30 docker run --rm novelwarden:smoke || status=$?
          if [ "$status" != 1 ]; then
            echo "::error::沒給 NOVELWARDEN_TOKEN 時應當拒絕啟動（退出碼 1），實際是 $status"
            exit 1
          fi

          docker run -d --name novelwarden-smoke -p 3680:3680 -e NOVELWARDEN_TOKEN="$SMOKE_TOKEN" novelwarden:smoke
          trap 'docker logs novelwarden-smoke; docker rm -f novelwarden-smoke >/dev/null' EXIT
          for i in $(seq 30); do
            curl -s -o /dev/null http://127.0.0.1:3680/media/view.js && break
            sleep 1
          done

          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://127.0.0.1:3680/media/view.js)" = 200
          test "$(code http://127.0.0.1:3680/)" = 401
          test "$(code -d token=wrong http://127.0.0.1:3680/login)" = 401
          cookie="$(curl -s -o /dev/null -D - -d "token=$SMOKE_TOKEN" http://127.0.0.1:3680/login \
            | grep -i '^set-cookie:' | sed -E 's/^[^:]+: *([^;]+).*/\1/')"
          test -n "$cookie"
          test "$(code -H "cookie: $cookie" http://127.0.0.1:3680/)" = 200
          # 作者要在容器裡用 git 同步書：git 與 ssh 得在，而且以非 root 身份跑得起來。
          docker exec novelwarden-smoke git --version
          docker exec novelwarden-smoke ssh -V
          test "$(docker exec novelwarden-smoke id -u)" = 65532
          echo "冒煙通過"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 編雙架構並推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # source 這條把 GHCR 上的包關聯到本倉庫。
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
